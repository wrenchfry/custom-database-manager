<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Notebook</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>Research Notebook <small>local study workspace</small></strong><div><button id="inspect">Storage</button><button id="new" class="primary">New note</button></div></header>
<main><aside><input id="search" placeholder="Search notes"><div id="notes"></div></aside><section><input id="title" placeholder="Note title"><input id="tags" placeholder="tags, separated by commas"><textarea id="content" placeholder="Start writing..."></textarea><footer><span id="state">Saved locally</span><button id="card">Add flashcard</button></footer></section><aside class="review"><b>Due today <span id="count">0</span></b><div id="review"></div><div id="ratings"><button data-rate="0">Again</button><button data-rate="1">Hard</button><button data-rate="2">Good</button><button data-rate="3">Easy</button></div></aside></main>
<dialog id="cardbox"><form method="dialog"><h2>Create flashcard</h2><label>Question<input id="front"></label><label>Answer<textarea id="back"></textarea></label><button>Cancel</button><button id="create" class="primary">Create</button></form></dialog><dialog id="store"><h2>Storage inspector</h2><p>Read by the custom SQLite page parser.</p><pre id="data"></pre><button onclick="this.parentElement.close()">Close</button></dialog><script src="app.js"></script></body></html>
